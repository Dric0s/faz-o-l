# Faz o L — screen sharing com quase zero de delay
# Suba tudo com:  ./install.sh   (ou: docker compose up -d --build)

services:
  # HTTPS automático (Let's Encrypt) + proxy para o app e para o LiveKit
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Defina DOMAIN no .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - livekit

  # Servidor de mídia WebRTC (SFU). Recebe as telas e distribui pros espectadores.
  livekit:
    image: livekit/livekit-server:${LIVEKIT_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "7881:7881/tcp" # fallback WebRTC via TCP
      - "7882:7882/udp" # WebRTC (porta UDP única)
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        logging:
          level: info
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: true
          node_ip: "${LIVEKIT_NODE_IP:-}"
        keys:
          ${LIVEKIT_API_KEY:?Defina LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET:?Defina LIVEKIT_API_SECRET}
        webhook:
          api_key: ${LIVEKIT_API_KEY}
          urls:
            - http://app:3000/api/livekit/webhook
        room:
          empty_timeout: 300

  # Site + API + bot do Discord
  app:
    build: ./app
    restart: unless-stopped
    env_file: .env
    environment:
      LIVEKIT_HOST: http://livekit:7880
      PUBLIC_URL: https://${DOMAIN}

volumes:
  caddy_data:
  caddy_config:
