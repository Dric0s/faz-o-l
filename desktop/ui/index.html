<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Faz o L</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
      background: #111214; color: #f2f3f5; font: 15px/1.45 system-ui, "Segoe UI", sans-serif;
    }
    .card { width: min(420px, 100%); background: #1a1b1e; border: 1px solid #2e3035; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 14px; text-align: center; }
    .logo { width: 64px; height: 64px; margin: 0 auto; border-radius: 18px; background: #ed4245; display: grid; place-items: center; font-weight: 900; font-size: 38px; box-shadow: 0 4px 16px #ed424555; }
    h1 { margin: 0; font-size: 28px; }
    p { margin: 0; color: #949ba4; }
    input { width: 100%; font: inherit; color: inherit; background: #111214; border: 1px solid #2e3035; border-radius: 10px; padding: 12px; }
    input:focus { outline: 2px solid #5865f2; }
    button { border: 0; border-radius: 10px; padding: 12px; font: inherit; font-weight: 600; color: #fff; background: #5865f2; cursor: pointer; }
    button:hover { background: #4752c4; }
    .error { color: #ff8a8c; min-height: 1.4em; }
  </style>
</head>
<body>
  <form class="card" id="form">
    <div class="logo">L</div>
    <h1>Faz o L</h1>
    <p>Digite o endereço do servidor do Faz o L que a galera usa.</p>
    <input id="url" placeholder="live.seudominio.com" autocomplete="url" required autofocus />
    <button type="submit">Conectar</button>
    <div class="error" id="error"></div>
  </form>
  <script>
    const { invoke } = window.__TAURI__.core;
    invoke('get_server').then((s) => { if (s) document.getElementById('url').value = s; });
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      document.getElementById('error').textContent = '';
      try {
        await invoke('set_server', { url: document.getElementById('url').value });
      } catch (err) {
        document.getElementById('error').textContent = err;
      }
    });
  </script>
</body>
</html>
