# VPS limpa: Caddy cuida do HTTPS (Let's Encrypt) nas portas 80/443.
# Use junto com o docker-compose.yml (o install.sh já configura isso).

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Defina DOMAIN no .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - livekit

volumes:
  caddy_data:
  caddy_config:
