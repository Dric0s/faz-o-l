name: App desktop (Windows)

# Gera o instalador do app desktop num servidor Windows do GitHub.
# - A cada push em main que mexa em desktop/: instalador fica nos "Artifacts" do run.
# - Ao criar uma tag desktop-vX.Y.Z: também publica uma Release com o instalador.
# - Manual (aba Actions > Run workflow): dá pra escolher o servidor embutido.
#
# Servidor embutido no app: input "server_url" ou a variável do repositório
# FAZOL_SERVER_URL (Settings > Secrets and variables > Actions > Variables).

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      server_url:
        description: "Servidor do Faz o L embutido no app (ex.: https://live.seudominio.com)"
        required: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Instalar CLI do Tauri
        working-directory: desktop
        run: npm ci

      - name: Gerar instalador
        working-directory: desktop
        env:
          FAZOL_SERVER_URL: ${{ inputs.server_url || vars.FAZOL_SERVER_URL }}
        run: npm run build

      # Versão portátil: o .exe do app sozinho, roda sem instalar
      - name: Preparar versão portátil
        shell: pwsh
        run: |
          $version = (Get-Content desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item desktop/src-tauri/target/release/faz-o-l-desktop.exe "dist/FazOL-$version-portatil.exe"
          Copy-Item desktop/src-tauri/target/release/bundle/nsis/*.exe dist/

      - uses: actions/upload-artifact@v4
        with:
          name: faz-o-l-windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
