name: App desktop (Windows)

# Gera o instalador do app desktop num servidor Windows do GitHub.
# - Push em main que mexa em desktop/: instalador fica nos "Artifacts" do run (teste).
# - Tag de versão (alpha-0.1.0, beta-0.2.0, v1.0.0): publica uma Release com o
#   instalador + latest.json. Os apps instalados olham o latest.json da última
#   Release ao abrir e se atualizam sozinhos.
#
# Versão do app = versão da tag: alpha-0.1.0 -> 0.1.0-alpha, v1.0.0 -> 1.0.0.
#
# Segredos (Settings > Secrets and variables > Actions):
#   TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#   assinam a atualização (gere com "npx tauri signer generate" e ponha a chave
#   pública em plugins.updater.pubkey no tauri.conf.json). Sem eles o instalador
#   sai igual, só que sem atualização automática.
# Variável FAZOL_SERVER_URL: servidor embutido no app (ou input manual abaixo).

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
    tags:
      - "alpha-*"
      - "beta-*"
      - "rc-*"
      - "v*"
  workflow_dispatch:
    inputs:
      server_url:
        description: "Servidor do Faz o L embutido no app (ex.: https://live.seudominio.com)"
        required: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Instalar CLI do Tauri
        working-directory: desktop
        run: npm ci

      - name: Versão
        id: version
        shell: pwsh
        run: |
          $ref = "${{ github.ref_name }}"
          $conf = Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $release = $false
          if ("${{ github.ref_type }}" -eq "tag" -and $ref -match '^(alpha|beta|rc)-(\d+\.\d+\.\d+)$') {
            $version = "$($Matches[2])-$($Matches[1])"; $release = $true
          } elseif ("${{ github.ref_type }}" -eq "tag" -and $ref -match '^v(\d+\.\d+\.\d+)$') {
            $version = $Matches[1]; $release = $true
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            throw "Tag '$ref' fora do padrão (alpha-0.1.0, beta-0.1.0, rc-0.1.0, v1.0.0)"
          } else {
            $version = $conf.version
          }
          $signed = [bool]$env:TAURI_SIGNING_PRIVATE_KEY
          # Sobrescreve a versão e aponta a atualização pro repositório onde o build roda
          $override = @{
            version = $version
            bundle  = @{ createUpdaterArtifacts = $signed }
            plugins = @{ updater = @{ endpoints = @("https://github.com/${{ github.repository }}/releases/latest/download/latest.json") } }
          }
          $override | ConvertTo-Json -Depth 6 | Set-Content desktop/release.conf.json -Encoding utf8
          Write-Host "versão $version (release: $release, assinado: $signed)"
          "version=$version" >> $env:GITHUB_OUTPUT
          "release=$release" >> $env:GITHUB_OUTPUT
          "signed=$signed" >> $env:GITHUB_OUTPUT

      - name: Gerar instalador
        working-directory: desktop
        env:
          FAZOL_SERVER_URL: ${{ inputs.server_url || vars.FAZOL_SERVER_URL }}
        run: npx tauri build --config release.conf.json

      - name: Preparar arquivos
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          $setup = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $name = "FazOL-$version-setup.exe"
          Copy-Item $setup.FullName "dist/$name"
          if ("${{ steps.version.outputs.signed }}" -eq "True") {
            Copy-Item "$($setup.FullName).sig" "dist/$name.sig"
            # Manifesto lido pelos apps instalados (releases/latest/download/latest.json)
            $manifest = [ordered]@{
              version  = $version
              notes    = "Faz o L $version"
              pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
              platforms = [ordered]@{
                "windows-x86_64" = [ordered]@{
                  signature = (Get-Content "$($setup.FullName).sig" -Raw).Trim()
                  url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$name"
                }
              }
            }
            $manifest | ConvertTo-Json -Depth 5 | Set-Content dist/latest.json -Encoding utf8NoBOM
          }
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: faz-o-l-windows
          path: dist/*-setup.exe
          if-no-files-found: error

      - name: Publicar Release
        if: steps.version.outputs.release == 'True'
        uses: softprops/action-gh-release@v2
        with:
          name: Faz o L ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
          # Precisa ser a "latest" (não pre-release) pro latest.json ser achado
          prerelease: false
          make_latest: true
